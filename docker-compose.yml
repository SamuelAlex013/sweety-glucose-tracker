services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_local
      POSTGRES_DB: sweety
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - sweety_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sweety -d sweety']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sweety_data:
