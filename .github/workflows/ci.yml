name: Sweety checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: sweety_local
          POSTGRES_DB: sweety_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sweety -d sweety_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sweety:sweety_local@localhost:5432/sweety_test
      TEST_DATABASE_URL: postgresql://sweety:sweety_local@localhost:5432/sweety_test
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
